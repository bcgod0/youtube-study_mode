<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="18" fill="#0f0f0f"/>
  <!-- Screen frame -->
  <rect x="10" y="18" width="108" height="74" rx="8" fill="#ff0000"/>
  <!-- Screen inner -->
  <rect x="16" y="24" width="96" height="62" rx="5" fill="#1a1a1a"/>
  <!-- Play triangle -->
  <polygon points="46,38 46,72 84,55" fill="#ffffff"/>
  <!-- Expand arrows (windowed-FS hint) -->
  <!-- top-left arrow -->
  <polyline points="22,44 22,34 32,34" fill="none" stroke="#ff0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- top-right arrow -->
  <polyline points="106,44 106,34 96,34" fill="none" stroke="#ff0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bottom-left arrow -->
  <polyline points="22,66 22,76 32,76" fill="none" stroke="#ff0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bottom-right arrow -->
  <polyline points="106,66 106,76 96,76" fill="none" stroke="#ff0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stand -->
  <rect x="54" y="92" width="20" height="6" rx="3" fill="#555"/>
  <rect x="44" y="98" width="40" height="5" rx="2.5" fill="#555"/>
</svg>
